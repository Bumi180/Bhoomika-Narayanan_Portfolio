<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhoomika Narayanan — Portfolio</title>
  <meta name="description" content="Portfolio of Bhoomika Narayanan, graphic designer and GBDA student at the University of Waterloo, based in Toronto. Web design, digital illustration, brand analysis, and UX/UI work.">
  <meta property="og:title" content="Bhoomika Narayanan Portfolio">
  <meta property="og:description" content="Graphic designer and GBDA student based in Toronto. Bold typography, digital illustration, and visual storytelling.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Bhoomika Narayanan Portfolio">
  <meta name="twitter:description" content="Graphic designer and GBDA student based in Toronto. Bold typography, digital illustration, and visual storytelling.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231B3A6B'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EBN%3C/text%3E%3Ccircle cx='50' cy='16' r='6' fill='%239B1B30'/%3E%3C/svg%3E">
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --white:      #ffffff;
      --soft:       #f8f8f8;
      --mint:       #9B1B30;
      --mint-light: #fbecee;
      --mint-mid:   rgba(155,27,48,0.3);
      --pink:       #1B3A6B;
      --pink-light: #eef2f7;
      --pink-mid:   rgba(27,58,107,0.3);
      --ink:        #111111;
      --mid:        #555555;
      --muted:      #aaaaaa;
      --rule:       rgba(0,0,0,0.09);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--white); font-family: 'Bricolage Grotesque', sans-serif; color: var(--ink); overflow-x: hidden; }
    .cursor { width: 16px; height: 16px; border: 2px solid var(--pink); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: transform 0.1s ease, background 0.2s ease; mix-blend-mode: multiply; }
    .cursor.clicked { transform: translate(-50%, -50%) scale(0.6); background: var(--pink); }
    @media (hover: none) { .cursor { display: none; } }

    /* loading screen */
    .loader { position: fixed; inset: 0; z-index: 20000; background: var(--white); display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease, visibility 0.5s ease; }
    .loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .loader-kicker { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 18px; color: var(--muted); transform: rotate(-1.5deg); }
    .loader-name { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 900; font-size: clamp(26px, 6vw, 50px); letter-spacing: -1px; color: var(--ink); display: flex; align-items: center; gap: 10px; white-space: nowrap; min-height: 1.1em; }
    .loader-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); flex-shrink: 0; animation: loaderBlink 0.9s step-end infinite; }
    .loader-bar { width: 160px; height: 2px; background: var(--rule); border-radius: 99px; overflow: hidden; margin-top: 2px; }
    .loader-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--pink), var(--mint)); transition: width 2.4s cubic-bezier(0.16,1,0.3,1); }
    .loader-sub { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
    @keyframes loaderBlink { 50% { opacity: 0; } }
    .page { display: flex; min-height: 100vh; }
    .stripe { width: 6px; flex-shrink: 0; background: var(--pink); position: sticky; top: 0; height: 100vh; align-self: flex-start; }
    .main { flex: 1; min-width: 0; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 36px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); }
    .nav-left { display: flex; align-items: center; }
    .nav-name { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--ink); }
    .nav-sub { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-left: 10px; }
    .nav-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); margin-left: 8px; vertical-align: middle; }
    .nav-links { display: flex; gap: 0; align-items: center; }
    .nav-links a { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 6px 18px; transition: color 0.15s; }
    .nav-links a:hover { color: var(--ink); }
    .nav-cv { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--pink); text-decoration: none; padding: 6px 0 6px 18px; transition: opacity 0.15s; }
    .nav-cv:hover { opacity: 0.7; }
    .hero { padding: 60px 36px 48px; border-bottom: 1px solid var(--rule); }
    .hero-kicker { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; color: var(--muted); display: block; margin-bottom: 4px; transform: rotate(-1.5deg); transform-origin: left; }
    .hero-h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(60px, 10vw, 96px); font-weight: 900; line-height: 0.87; letter-spacing: -3px; color: var(--ink); margin-bottom: 32px; }
    .hero-h1 .mint { color: var(--mint); }
    .hero-h1 .ghost { color: transparent; -webkit-text-stroke: 2.5px var(--ink); }
    .hero-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    .hero-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px; line-height: 2.2; text-transform: uppercase; color: var(--muted); }
    .hero-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 5px 14px; border-radius: 99px; border: 1px solid var(--rule); color: var(--mid); background: var(--white); transition: border-color 0.15s; }
    .tag:hover { border-color: var(--ink); }
    .tag-mint { background: var(--mint-light); border-color: var(--mint-mid); color: var(--mint); }
    .tag-pink { background: var(--pink-light); border-color: var(--pink-mid); color: var(--pink); }
    .section-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 36px; border-bottom: 1px solid var(--rule); }
    .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--ink); }
    .section-count { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--muted); }
    .subsection-head { padding: 10px 36px; background: var(--soft); border-bottom: 1px solid var(--rule); }
    .subsection-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--pink); }

    /* Premium Asymmetrical Grid Layout Layout */
    .featured-grid { display: grid; grid-template-columns: repeat(12, 1fr); background: var(--white); }
    .featured { display: grid; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); background: var(--white); transition: background-color 0.3s ease; }
    .featured:hover { background-color: var(--soft); }
    
    /* Varied Grid Sizing Systems */
    .featured.span-8 { grid-column: span 8; grid-template-columns: 1.5fr 1fr; }
    .featured.span-4 { grid-column: span 4; grid-template-columns: 1fr; border-right: none; }
    .featured.span-7 { grid-column: span 7; grid-template-columns: 1.2fr 1fr; }
    .featured.span-5 { grid-column: span 5; grid-template-columns: 1fr; border-right: none; }
    .featured.span-12 { grid-column: span 12; grid-template-columns: 2fr 1fr; border-right: none; }

    .feat-media { border-right: 1px solid var(--rule); background: var(--mint-light); position: relative; overflow: hidden; min-height: 450px; display: flex; align-items: center; justify-content: center; }
    .featured.span-4 .feat-media, .featured.span-5 .feat-media { border-right: none; border-bottom: 1px solid var(--rule); min-height: 300px; }
    .feat-media iframe { display: block; width: 100%; height: 100%; min-height: 100%; border: none; }

    @media (max-width: 1024px) {
      .featured.span-8, .featured.span-4, .featured.span-7, .featured.span-5, .featured.span-12 { grid-column: span 12; grid-template-columns: 1fr; border-right: none; }
      .feat-media { border-right: none; border-bottom: 1px solid var(--rule); min-height: 350px; }
    }
  </style>
</head>
<body>

  <div class="loader" id="loader">
    <div class="loader-inner">
      <span class="loader-kicker">welcome to my portfolio</span>
      <h2 class="loader-name">// loading<span class="loader-dot"></span></h2>
      <div class="loader-bar"><div class="loader-bar-fill" id="loader-bar-fill"></div></div>
      <span class="loader-sub">Bhoomika Narayanan</span>
    </div>
  </div>

  <div class="page">
    <div class="stripe"></div>
